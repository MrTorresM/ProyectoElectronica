<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Automatización del Interferómetro de Michelson-Morley</title>
  <link rel="stylesheet" href="../CSS/styles.css">
  <script src="../JAVASCRIPT/scripts.js" defer></script>
</head>
<body>
  <header>
    <h1>Automatización del Interferómetro de Michelson-Morley</h1>
    <h2>Desarrollado por: Gabriela Rodríguez y Miguel Roa</h2>
  </header>

  <main>
    <div class="columna">
      <div class="dato">Ángulo de inclinación: <span id="angulo">0°</span></div>
      <div class="dato">d<sub>max</sub>: <span id="dmax">0</span></div>
    </div>

    <!-- ===== BRÚJULA ===== -->
    <div class="columna">
      <div class="widget" data-sensor="orientacion">
        <h3>Brújula Digital</h3>
        <div class="navigation-container">
          <div class="nav-compass-ring">
            <div class="nav-directions">
              <span>N</span><span>E</span><span>S</span><span>O</span>
            </div>
            <div class="nav-needle"></div>
            <div class="nav-center-dot"></div>
          </div>
          <p class="nav-readout">Dirección: <span id="nav-direction-text">--</span></p>
        </div>
      </div>
    </div>
  </main>

  <!-- Imagen del ESP32-CAM -->
  <img id="streamImage" src="http://192.168.243.10/capture" alt="ESP32-CAM">

  <!-- Modal -->
  <div id="imageModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">&times;</span>
      <img id="modalImg" src="" alt="Vista ampliada">
    </div>
  </div>

  <div class="shutdown-container">
    <button id="shutdown-btn">Apagar Interfaz</button>
  </div>

  <footer>
    &copy; 2025 Proyecto de Automatización Experimental
  </footer>
</body>
</html>
